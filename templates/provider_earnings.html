{% extends "layout.html" %}
{% block content %}
<main class="dashboard-page"><section class="dashboard-hero"><span class="dashboard-eyebrow">Provider workspace</span><h1>Earnings</h1><p>Your total is calculated from completed rentals stored in the database.</p><a href="/home" class="btn btn-outline-primary btn-sm mt-3">Back to dashboard</a></section><section class="workspace-empty-state"><span class="feature-label">Completed rentals</span><h2>{{ summary.completed_rentals }}</h2><span class="feature-label">Total earnings</span><h2>${{ '%.2f'|format(summary.total) }}</h2></section></main>
{% endblock %}
