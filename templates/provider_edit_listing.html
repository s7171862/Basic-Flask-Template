{% extends "layout.html" %}
{% block content %}
<main class="dashboard-page">
    <section class="dashboard-hero"><span class="dashboard-eyebrow">Provider workspace</span><h1>Edit {{ tool.title }}</h1><p>Update the details renters see when they search for your tool.</p></section>
    <section class="workspace-panel"><div class="workspace-panel-heading"><h2>Listing details</h2><a href="/provider/listings" class="btn btn-outline-primary btn-sm">Back to listings</a></div><form method="POST" enctype="multipart/form-data" class="row g-3">
        <div class="col-md-6"><label class="form-label" for="title">Tool name</label><input class="form-control" id="title" name="title" value="{{ tool.title }}" required></div>
        <div class="col-md-3"><label class="form-label" for="daily_rate">Daily rate ($)</label><input class="form-control" id="daily_rate" name="daily_rate" type="number" min="0.01" step="0.01" value="{{ tool.daily_rate }}" required></div>
        <div class="col-md-3"><label class="form-label" for="city">Queensland city</label><select class="form-select" id="city" name="city" data-location-city data-selected="{{ tool.city }}" required><option value="">Choose a city</option></select></div>
        <div class="col-md-4"><label class="form-label" for="suburb">Suburb</label><select class="form-select" id="suburb" name="suburb" data-location-suburb data-selected="{{ tool.suburb }}" required><option value="">Choose a city first</option></select></div>
        <div class="col-md-4"><label class="form-label" for="tool_type">Tool type</label><input class="form-control" id="tool_type" name="tool_type" value="{{ tool.tool_type }}" required></div>
        <div class="col-md-4"><label class="form-label" for="brand">Brand</label><input class="form-control" id="brand" name="brand" value="{{ tool.brand }}" required></div>
        <div class="col-md-4"><label class="form-label" for="tool_condition">Condition</label><select class="form-select" id="tool_condition" name="tool_condition" required>{% for value in ['New', 'Excellent', 'Good', 'Fair'] %}<option {% if tool.tool_condition == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></div>
        <div class="col-md-4"><label class="form-label" for="available_from">Available from</label><input class="form-control" id="available_from" name="available_from" type="date" value="{{ tool.available_from }}" required></div>
        <div class="col-md-4"><label class="form-label" for="available_until">Available until</label><input class="form-control" id="available_until" name="available_until" type="date" value="{{ tool.available_until }}" required></div>
        <div class="col-12"><label class="form-label" for="toolphoto">Replace tool photo <span class="optional-label">optional</span></label><input class="form-control" id="toolphoto" name="toolphoto" type="file" accept=".png,.jpg,.jpeg,.gif,image/png,image/jpeg,image/gif"><div class="form-text">Accepted file types: PNG, JPG, JPEG, or GIF. Leave blank to keep the existing photo.</div></div>
        <div class="col-12"><label class="form-label" for="description">Description</label><textarea class="form-control" id="description" name="description" rows="3" required>{{ tool.description }}</textarea></div>
        <div class="col-12"><button class="btn btn-primary">Save listing changes</button></div>
    </form></section>
</main>
{% endblock %}
